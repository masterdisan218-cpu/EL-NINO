<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Schematic of El Niño warming in the equatorial Pacific</title>
  <desc id="description">A simplified Pacific cross-section showing warm surface water extending eastward, weaker trade winds, and increased rain over the central and eastern Pacific.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1d9ac0"/>
      <stop offset="1" stop-color="#123b68"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" x2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="28" fill="#eff6ff"/>
  <text x="320" y="42" text-anchor="middle" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">Equatorial Pacific · simplified schematic</text>
  <path d="M56 202 Q320 180 584 202 L584 288 Q320 323 56 288Z" fill="url(#ocean)"/>
  <path d="M56 202 Q320 180 584 202 L584 225 Q370 207 190 229 Q112 237 56 228Z" fill="url(#warm)"/>
  <path d="M56 202 Q88 172 130 202 L130 226 Q91 233 56 228Z" fill="#4ade80"/>
  <path d="M510 202 Q545 169 584 202 L584 225 Q550 216 510 222Z" fill="#94a3b8"/>
  <text x="93" y="255" text-anchor="middle" fill="#ecfeff" font-family="Arial, sans-serif" font-size="14" font-weight="700">WEST</text>
  <text x="320" y="255" text-anchor="middle" fill="#fff7ed" font-family="Arial, sans-serif" font-size="14" font-weight="700">CENTRAL PACIFIC</text>
  <text x="548" y="255" text-anchor="middle" fill="#ecfeff" font-family="Arial, sans-serif" font-size="14" font-weight="700">EAST</text>
  <path d="M460 111 C366 87 275 88 184 112" fill="none" stroke="#1d4ed8" stroke-linecap="round" stroke-width="8"/>
  <path d="m193 99-17 13 20 9" fill="none" stroke="#1d4ed8" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
  <text x="322" y="82" text-anchor="middle" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Weaker easterly trade winds</text>
  <path d="M360 143c0-16 13-27 28-27 7-14 28-16 38-3 17-3 29 8 29 21 0 13-11 20-25 20h-47c-14 0-23-4-23-11Z" fill="#fff" stroke="#93c5fd" stroke-width="3"/>
  <path d="M383 159v15m25-15v18m25-18v15" stroke="#0284c7" stroke-linecap="round" stroke-width="4"/>
  <text x="413" y="195" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="13" font-weight="700">Rainfall shifts east</text>
</svg>
